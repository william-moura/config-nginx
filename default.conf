# 1. Redirecionamento de HTTP (Porta 80) para HTTPS (Porta 443)
server {
    listen 80;
    listen [::]:80;
    server_name sysmanager.tech .sysmanager.tech www.sysmanager.tech;

    # Necessário para a renovação do Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Configuração HTTPS (Porta 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sysmanager.tech .sysmanager.tech;

    # Caminhos dos Certificados (Mapeados via Docker Volume)
    ssl_certificate /etc/letsencrypt/live/sysmanager.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysmanager.tech/privkey.pem;

    # Otimizações de Segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Definição das Raízes
    set $laravel_root /var/www/public;
    set $angular_root /usr/share/nginx/html;

    # --- ARQUIVOS ESTÁTICOS DO LARAVEL ---

    # Imagens / Uploads no Storage do Laravel
    location /storage/ {
        root $laravel_root; # O symlink padrão fica em /var/www/public/storage
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires max;
        add_header Access-Control-Allow-Origin *;
    }

    # Pastas de assets compilados ou públicos do Laravel (Vite, images, CSS, vendor)
    # Inclui /images, /build, /vendor, /css, /js, /assets quando pertencerem ao Laravel
    location ~* ^/(build|vendor|images|assets-laravel)/ {
        root $laravel_root;
        try_files $uri =404;
        access_log off;
        expires max;
    }

    # --- ROTAS WEB / API DO LARAVEL ---
    location ^~ /api {
        root $laravel_root;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /admin {
        root $laravel_root;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processamento de arquivos PHP
    location ~ \.php$ {
        root $laravel_root;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $laravel_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS on;
    }

    # --- FALLBACK DE IMAGENS E MÍDIAS COMPARTILHADAS ---
    # Se a imagem não for achada na pasta do Angular, tenta achar na public do Laravel
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        root $angular_root;
        try_files $uri @fallback_laravel_assets;
        access_log off;
        expires 30d;
    }

    location @fallback_laravel_assets {
        root $laravel_root;
        try_files $uri =404;
    }

    # --- CONFIGURAÇÃO DO FRONTEND (Angular) ---
    location / {
        root $angular_root;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proteção de arquivos sensíveis (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Otimização de Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}